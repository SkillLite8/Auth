name: Build Admin Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install hatchling build

      - name: Debug - show repo structure
        run: find . -not -path './.git/*' | sort

      - name: Find project directory
        id: find_proj
        run: |
          TOML=$(find . -not -path './.git/*' -name "pyproject.toml" 2>/dev/null | head -1)
          if [ -z "$TOML" ]; then
            echo "❌ pyproject.toml не найден, содержимое репо:"
            find . -not -path './.git/*' | sort
            exit 1
          fi
          DIR=$(dirname "$TOML")
          echo "✅ Найден pyproject.toml: $TOML"
          echo "✅ Рабочая папка: $DIR"
          echo "proj_dir=$DIR" >> $GITHUB_OUTPUT

      - name: Build WHL
        run: python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist"
        working-directory: ${{ steps.find_proj.outputs.proj_dir }}

      - name: Show result
        run: ls -lh dist/

      - name: Upload WHL
        uses: actions/upload-artifact@v4
        with:
          name: endstone-invis-whl
          path: dist/*.whl
          retention-days: 90
