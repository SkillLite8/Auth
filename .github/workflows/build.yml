name: Build Go Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Initialize Go Module & Fetch Dependencies
      run: |
        go mod init dumper
        go get github.com/sandertv/gophertunnel@master
        go get github.com/google/uuid
        go mod tidy

    - name: Compile to Windows EXE
      env:
        GOOS: windows
        GOARCH: amd64
      run: go build -ldflags="-s -w" -o dist/dumper.exe main.go

    - name: Upload Artifact (.EXE)
      uses: actions/upload-artifact@v4
      with:
        name: NeverTime-RP-Dumper-Windows
        path: dist/dumper.exe
