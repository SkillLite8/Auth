name: Build Python Autoclicker

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install keyboard customtkinter pyinstaller

    - name: Compile to EXE
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "SpeedAutoClicker" main.py

    - name: Upload Artifact (.EXE)
      uses: actions/upload-artifact@v4
      with:
        name: SpeedAutoClicker-Windows
        path: dist/SpeedAutoClicker.exe
        if-no-files-found: error
