
name: Build BELOW for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract BELOW ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/BELOW-Godot-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -type f \
              -name "BELOW-Godot-Project.zip" \
              -print -quit)
          fi

          if [ -z "${ZIP_FILE:-}" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: BELOW-Godot-Project.zip not found!"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/extracted_project" \
            -maxdepth 3 -type f | head -n 100

      - name: Find Godot project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_FILE=$(find \
            "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "project.godot" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            find "$GITHUB_WORKSPACE/extracted_project" -maxdepth 5
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "GODOT_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Found project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found!"
            exit 1
          fi

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot installation
        shell: bash
        run: |
          set -euo pipefail

          godot --version

          echo "Checking Windows export templates..."

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"

          if [ ! -d "$TEMPLATE_DIR" ]; then
            echo "ERROR: Export template directory not found!"
            find "$HOME/.local/share/godot" -maxdepth 4 -type f || true
            exit 1
          fi

          ls -lah "$TEMPLATE_DIR"

      - name: Fix project import and check scripts
        shell: bash
        run: |
          set -euo pipefail

          echo "Importing Godot project..."

          godot --headless \
            --editor \
            --path "$GODOT_PROJECT" \
            --import

          echo "Checking project configuration..."

          test -f "$GODOT_PROJECT/project.godot"
          test -f "$GODOT_PROJECT/export_presets.cfg"

      - name: Export Windows EXE
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GODOT_PROJECT/exports"
          OUTPUT_EXE="$OUTPUT_DIR/BELOW.exe"

          mkdir -p "$OUTPUT_DIR"

          echo "Exporting Windows Desktop..."

          godot --headless \
            --path "$GODOT_PROJECT" \
            --export-release "Windows Desktop" \
            "$OUTPUT_EXE"

          if [ ! -s "$OUTPUT_EXE" ]; then
            echo "ERROR: BELOW.exe was not created!"
            exit 1
          fi

          echo "Export successful!"
          ls -lh "$OUTPUT_DIR"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BELOW-Windows
          path: |
            extracted_project/**/exports/BELOW.exe
            extracted_project/**/exports/BELOW.pck
          if-no-files-found: error
          retention-days: 14
