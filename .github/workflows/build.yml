name: Build EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller keyboard

      - name: Build EXE
        run: |
          pyinstaller ^
          --onefile ^
          --windowed ^
          --clean ^
          --name AutoClicker ^
          main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker
          path: dist/AutoClicker.exe
