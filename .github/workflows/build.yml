name: Build BELOW for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          echo "Looking for ZIP archives..."
          ls -la
          
          ZIP_FILE=$(find . -maxdepth 2 -name "BELOW-Godot-Project.zip" -o -name "*.zip" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in the repository!"
            exit 1
          fi
          
          echo "Found ZIP archive: $ZIP_FILE"
          echo "Extracting archive..."
          unzip -q "$ZIP_FILE" -d extracted_project
          
          echo "Extraction complete. Contents:"
          ls -la extracted_project

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Find Godot project
        shell: bash
        run: |
          echo "Searching for project.godot..."
          PROJECT_FILE=$(find extracted_project -name project.godot -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found inside the ZIP archive!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "GODOT_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project directory: $PROJECT_DIR"

      - name: Install export templates
        shell: bash
        run: |
          godot --headless --editor --path "$GODOT_PROJECT" --import || true
          godot --headless --editor --path "$GODOT_PROJECT" --quit

      - name: Export Windows EXE
        shell: bash
        run: |
          mkdir -p "$GODOT_PROJECT/exports"
          godot --headless --path "$GODOT_PROJECT" \
            --export-release "Windows Desktop" \
            "$GODOT_PROJECT/exports/BELOW.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BELOW-Windows
          path: |
            **/exports/BELOW.exe
            **/exports/BELOW.pck
          if-no-files-found: error
