name: Build PHAR

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Extract ZIP
        run: |
          mkdir source
          unzip ReCore.zip -d source

      - name: Create PHAR
        run: |
          cat > build.php << 'EOF'
          <?php

          $phar = new Phar("ReCore.phar");
          $phar->startBuffering();
          $phar->buildFromDirectory("source");
          $phar->setStub($phar->createDefaultStub("src/PocketMine.php"));
          $phar->stopBuffering();

          echo "PHAR created\n";
          EOF

          php -d phar.readonly=0 build.php

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReCore-PHAR
          path: ReCore.phar
