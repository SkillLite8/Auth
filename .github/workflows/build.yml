
name: Build BELOW for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find and extract BELOW ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for BELOW-Godot-Project.zip..."

          ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "BELOW-Godot-Project.zip" \
            -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BELOW-Godot-Project.zip not found!"
            echo "Repository files:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
            exit 1
          fi

          echo "Found archive: $ZIP_FILE"

          mkdir -p "$GITHUB_WORKSPACE/extracted_project"

          unzip -oq "$ZIP_FILE" \
            -d "$GITHUB_WORKSPACE/extracted_project"

          echo "Archive extracted successfully."

          echo "Searching extracted files..."
          find "$GITHUB_WORKSPACE/extracted_project" \
            -maxdepth 4 -type f | head -n 100

      - name: Find Godot project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project.godot..."

          PROJECT_FILE=$(find \
            "$GITHUB_WORKSPACE/extracted_project" \
            -type f \
            -name "project.godot" \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found!"
            find "$GITHUB_WORKSPACE/extracted_project" -maxdepth 5
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          if [ ! -f "$PROJECT_DIR/export_presets.cfg" ]; then
            echo "ERROR: export_presets.cfg not found!"
            exit 1
          fi

          echo "GODOT_PROJECT=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot project: $PROJECT_DIR"
          echo "Export presets found."

      - name: Install Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Import Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --version

          godot --headless \
            --editor \
            --path "$GODOT_PROJECT" \
            --import

          echo "Godot project import completed."

      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project files..."

          test -f "$GODOT_PROJECT/project.godot"
          test -f "$GODOT_PROJECT/export_presets.cfg"

          echo "Project files verified."

      - name: Export Windows EXE
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="$GODOT_PROJECT/exports"
          OUTPUT_EXE="$OUTPUT_DIR/BELOW.exe"

          mkdir -p "$OUTPUT_DIR"

          echo "Exporting Windows Desktop..."

          godot --headless \
            --path "$GODOT_PROJECT" \
            --export-release "Windows Desktop" \
            "$OUTPUT_EXE"

          if [ ! -s "$OUTPUT_EXE" ]; then
            echo "ERROR: Windows EXE was not created!"
            exit 1
          fi

          echo "Build completed successfully!"
          ls -lh "$OUTPUT_EXE"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: BELOW-Windows
          path: extracted_project/**/exports/BELOW.exe
          if-no-files-found: error
          retention-days: 14
